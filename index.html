<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나는 어떤 귀신이 될까? 👻</title>
  <meta name="description" content="죽으면 나는 어떤 귀신이 될까? 10문항으로 알아보는 나의 귀신 유형 테스트">
  <meta property="og:title" content="나는 어떤 귀신이 될까? 👻">
  <meta property="og:description" content="10문항으로 알아보는 나의 귀신 유형 테스트">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b18;
      --surface: rgba(255,255,255,0.06);
      --surface-hover: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.1);
      --border-hover: rgba(139,92,246,0.6);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --purple: #a78bfa;
      --cyan: #67e8f9;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Background gradient blobs */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(139,92,246,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(6,182,212,0.1) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 50% 50%, rgba(236,72,153,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatUp linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
      8%   { opacity: 0.7; }
      92%  { opacity: 0.7; }
      100% { transform: translateY(-80px) rotate(540deg); opacity: 0; }
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    /* ── Shared screen ── */
    .screen {
      width: 100%;
      max-width: 580px;
    }

    .fade-in {
      animation: fadeSlideUp 0.5s ease both;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Intro ── */
    .intro-emoji {
      font-size: 86px;
      text-align: center;
      display: block;
      animation: bob 3.5s ease-in-out infinite;
      line-height: 1;
      margin-bottom: 20px;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-14px) rotate(3deg); }
    }

    .intro-title {
      text-align: center;
      font-size: clamp(26px, 6vw, 44px);
      font-weight: 900;
      line-height: 1.25;
      background: linear-gradient(135deg, #c084fc 0%, #67e8f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .intro-subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .intro-tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .tag {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      color: var(--muted);
    }

    .btn-start {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0 auto;
      padding: 17px 32px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      border: none;
      border-radius: 50px;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 32px rgba(139,92,246,0.45);
    }

    .btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 48px rgba(139,92,246,0.65);
    }

    /* ── Progress ── */
    .progress-wrap { margin-bottom: 24px; }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-label { color: var(--muted); font-size: 13px; }

    .progress-count { color: var(--purple); font-weight: 700; font-size: 13px; }

    .progress-bar {
      height: 5px;
      background: var(--surface);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #06b6d4);
      border-radius: 3px;
      transition: width 0.45s cubic-bezier(.4,0,.2,1);
    }

    /* ── Question card ── */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px 28px;
      backdrop-filter: blur(12px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .question-card.leaving {
      opacity: 0;
      transform: translateX(-28px);
    }

    .question-card.entering {
      opacity: 0;
      transform: translateX(28px);
    }

    .q-number {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--purple);
      margin-bottom: 14px;
    }

    .q-text {
      font-size: clamp(17px, 4vw, 21px);
      font-weight: 800;
      line-height: 1.45;
      margin-bottom: 26px;
    }

    .options { display: grid; gap: 11px; }

    .option-btn {
      width: 100%;
      padding: 15px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.18s;
      line-height: 1.45;
    }

    .option-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateX(5px);
    }

    .option-btn.selected {
      background: rgba(139,92,246,0.22);
      border-color: #a78bfa;
    }

    .option-btn:disabled { cursor: default; }

    /* ── Result ── */
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 28px 36px;
      backdrop-filter: blur(12px);
      text-align: center;
    }

    .result-badge {
      display: inline-block;
      padding: 4px 16px;
      border-radius: 20px;
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.35);
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-bottom: 22px;
    }

    .result-emoji {
      font-size: 84px;
      display: block;
      margin-bottom: 16px;
      animation: bob 3.5s ease-in-out infinite;
    }

    .result-subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .result-name {
      font-size: clamp(32px, 8vw, 52px);
      font-weight: 900;
      margin-bottom: 24px;
      line-height: 1.1;
    }

    .result-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.85;
      margin-bottom: 24px;
      text-align: left;
      padding: 18px 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .traits {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .trait {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
    }

    .result-actions {
      display: flex;
      gap: 11px;
    }

    .btn-retry {
      flex: 1;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-retry:hover { background: var(--surface-hover); }

    .btn-share {
      flex: 1;
      padding: 14px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(139,92,246,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-share:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgba(139,92,246,0.55);
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e293b;
      color: var(--text);
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      z-index: 100;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .question-card, .result-card { padding: 24px 18px; }
      .result-actions { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<main class="app">

  <!-- ── Intro ── -->
  <section class="screen fade-in" id="screenIntro">
    <span class="intro-emoji">👻</span>

    <p class="intro-subtitle">

  <!-- ── Questions ── -->
  <section class="screen" id="screenQuestion" style="display:none">
    <div class="progress-wrap">
      <div class="progress-top">
        <span class="progress-label">진행 중...</span>

      <div class="progress-bar">

    </div>
    <div class="question-card" id="questionCard">

      <div class="options" id="options"></div>

  </section>

  <!-- ── Result ── -->
  <section class="screen" id="screenResult" style="display:none">
    <div class="result-card fade-in">
      <div class="result-badge">나의 귀신 유형은...</div>
      <span class="result-emoji" id="resultEmoji"></span>
      <p class="result-subtitle" id="resultSubtitle"></p>
      <h2 class="result-name" id="resultName"></h2>
      <div class="result-desc" id="resultDesc"></div>
      <div class="traits" id="resultTraits"></div>
      <div class="result-actions">
        <button class="btn-retry" id="btnRetry">다시 테스트</button>
        <button class="btn-share" id="btnShare">결과 공유하기</button>
      </div>
    </div>
  </section>

</main>

<div class="toast" id="toast">링크가 복사됐어요! 👻</div>

<script>
/* ── Particles ── */
(function () {
  const el = document.getElementById('particles');
  const colors = ['#8b5cf6','#06b6d4','#ec4899','#f59e0b','#a78bfa'];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 5 + 2;
    p.style.cssText = [
      `width:${size}px`,
      `height:${size}px`,
      `left:${Math.random() * 100}%`,
      `background:${colors[Math.floor(Math.random() * colors.length)]}`,
      `animation-duration:${Math.random() * 18 + 10}s`,
      `animation-delay:${Math.random() * 20}s`,
      `filter:blur(1px)`,
    ].join(';');
    el.appendChild(p);
  }
}());

/* ── State ── */
let currentQ = 0;
let scores = [];

/* ── UI helpers ── */
function show(id)  { document.getElementById(id).style.display = 'block'; }
function hide(id)  { document.getElementById(id).style.display = 'none'; }

function showToast(msg) {
  const t = document.getElementById('toast');
  if (msg) t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

/* ── Test flow ── */
function startTest() {
  currentQ = 0;
  scores = new Array(GHOSTS.length).fill(0);
  hide('screenIntro');
  show('screenQuestion');
  hide('screenResult');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  const pct = (currentQ / QUESTIONS.length) * 100;

  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${currentQ + 1} / ${QUESTIONS.length}`;
  document.getElementById('qNumber').textContent = `Q${currentQ + 1}`;
  document.getElementById('qText').textContent = q.q;

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.addEventListener('click', () => pickOption(i));
    optionsEl.appendChild(btn);
  });
}

function pickOption(idx) {
  const opt = QUESTIONS[currentQ].opts[idx];
  opt.s.forEach((v, i) => { scores[i] += v; });

  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => { b.disabled = true; });
  btns[idx].classList.add('selected');

  const card = document.getElementById('questionCard');

  setTimeout(() => {
    card.classList.add('leaving');
    setTimeout(() => {
      card.classList.remove('leaving');
      currentQ++;
      if (currentQ < QUESTIONS.length) {
        card.classList.add('entering');
        renderQuestion();
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            card.classList.remove('entering');
          });
        });
      } else {
        showResult();
      }
    }, 250);
  }, 280);
}

function showResult() {
  const maxScore = Math.max(...scores);
  /* collect ties, pick randomly among them */
  const candidates = scores.reduce((acc, v, i) => (v === maxScore ? [...acc, i] : acc), []);
  const idx = candidates[Math.floor(Math.random() * candidates.length)];
  const ghost = GHOSTS[idx];

  document.getElementById('progressFill').style.width = '100%';

  document.getElementById('resultEmoji').textContent    = ghost.emoji;
  document.getElementById('resultSubtitle').textContent = ghost.subtitle;
  const nameEl = document.getElementById('resultName');
  nameEl.textContent  = ghost.name;
  nameEl.style.color  = ghost.color;

  document.getElementById('resultDesc').innerHTML =
    ghost.desc.replace(/\n/g, '<br>');

  const traitsEl = document.getElementById('resultTraits');
  traitsEl.innerHTML = '';
  ghost.traits.forEach(t => {
    const span = document.createElement('span');
    span.className = 'trait';
    span.textContent = `#${t}`;
    span.style.borderColor = ghost.color + '55';
    span.style.color = ghost.color;
    traitsEl.appendChild(span);
  });

  hide('screenQuestion');
  show('screenResult');
}

function restartTest() {
  hide('screenResult');
  show('screenIntro');
}

function shareResult() {
  const name  = document.getElementById('resultName').textContent;
  const emoji = document.getElementById('resultEmoji').textContent;
  const text  = `나는 ${emoji} ${name}!\n죽으면 나는 어떤 귀신이 될까? 테스트\n${location.href}`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => showToast('링크가 복사됐어요! 👻'))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('링크가 복사됐어요! 👻'); }
  catch { showToast('직접 링크를 복사해 주세요.'); }
  document.body.removeChild(ta);
}

/* ── Event listeners ── */
document.getElementById('btnStart').addEventListener('click', startTest);
document.getElementById('btnRetry').addEventListener('click', restartTest);
document.getElementById('btnShare').addEventListener('click', shareResult);
</script>
